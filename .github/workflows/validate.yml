name: validate-demo

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/run_demo.py --scenario baseline --grid-size 32 --output-dir outputs/ci
      - run: python src/run_experiment_matrix.py --output outputs/ci/experiment_matrix.csv
