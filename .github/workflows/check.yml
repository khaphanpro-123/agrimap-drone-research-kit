name: reproducibility-check

on:
  push:
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python src/run_demo.py --scenario baseline
      - run: python src/run_experiment_matrix.py
      - run: test -s outputs/demo_metrics.json
      - run: test -s outputs/experiment_matrix.csv
